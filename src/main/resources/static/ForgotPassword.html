
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - FilmFolio</title>

    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="ForgotPassword.css">
</head>

<body class="forgotPasswordPage">

<div class="forgotPasswordContainer">

    <h2>Forgot Password</h2>

    <p class="forgotPasswordText">
        Enter your email address and we will send you a password reset link.
    </p>

    <label class="emailLabel" for="resetEmail">
        Email:
    </label>

    <div class="emailContainer">
        <input
                type="email"
                id="resetEmail"
                placeholder="Example@gmail.com"
        >
    </div>

    <div class="forgotPasswordButtonContainer">
        <button
                class="forgotPasswordButton"
                id="forgotPasswordButton"
                type="button"
        >
            Send Reset Link
        </button>
    </div>

    <p id="forgotPasswordMessage"></p>

    <a id="backToLogin" href="LogIn.html">
        Back to Login
    </a>

</div>

<script src="ForgotPassword.js"></script>

</body>
</html>
