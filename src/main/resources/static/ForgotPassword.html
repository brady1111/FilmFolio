<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - FilmFolio</title>

    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="LogIn.css">
</head>

<body class="logInPage resetPage">

<div class="logInContainer">

    <h2>Reset Password</h2>

    <label id="passwordLabel">New Password:</label>

    <div class="passwordContainer">

        <input type="password" id="newpassword">

        <button type="button"
                id="toggleNewPassword"
                aria-label="Show password">

            <svg id="newEyeOpen"
                 xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>

            </svg>

            <svg id="newEyeClosed"
                 xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 style="display: none;">

                <path d="M3 3l18 18"/>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                <path d="M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-3 4.5"/>
                <path d="M6.6 6.6C3.8 8.5 2 12 2 12s3 7 10 7a10.8 10.8 0 0 0 3.2-.5"/>

            </svg>

        </button>

    </div>


    <div class="passwordRequirements">

        <p id="lengthRequirement">✕ At least 10 characters</p>

        <p id="capitalRequirement">✕ At least one capital letter</p>

        <p id="numberRequirement">✕ At least one number</p>

        <p id="specialRequirement">✕ At least one special character</p>

    </div>


    <label id="passwordLabel">Confirm Password:</label>

    <div class="passwordContainer">

        <input type="password" id="password">

        <button type="button"
                id="togglePassword"
                aria-label="Show password">

            <svg id="confirmEyeOpen"
                 xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>

            </svg>

            <svg id="confirmEyeClosed"
                 xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 style="display: none;">

                <path d="M3 3l18 18"/>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                <path d="M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-3 4.5"/>
                <path d="M6.6 6.6C3.8 8.5 2 12 2 12s3 7 10 7a10.8 10.8 0 0 0 3.2-.5"/>

            </svg>

        </button>

    </div>


    <div class="logInButtonContainer">

        <button class="logInButton" id="resetPasswordButton">
            Reset Password
        </button>

    </div>


    <p id="resetMessage"></p>

    <a id="signUp" href="LogIn.html">
        Back to Login
    </a>

</div>

<script src="ForgotPassword.js"></script>

</body>

</html>
