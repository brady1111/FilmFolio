<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lists - FilmFolio</title>

    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="Lists.css">
</head>

<body>

<header>

    <div class="logo">
        <h1>FilmFolio</h1>
    </div>

    <div class="userMenu">
        <button id="userButton" aria-label="User menu">
            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>
            </svg>
        </button>
    </div>

</header>

<main>
    <section class="listsSection">

        <div class="listsHeader">
            <h2>My Lists</h2>
            <button id="createListButton"> + Create New List</button>
        </div>

        <div id="listsContainer">
            <div class="listCard" id="favoritesList">
                <h3>Favorites</h3>
                <p id="favoritesCount">0 / 5 movies</p>
                <p class="listDescription">Your top 5 favorite movies.</p>
            </div>
        </div>

        <div id="selectedListContainer"></div>

    </section>

    <div id="createListModal" class="createListModal">

        <div class="createListContent">

            <button id="closeCreateList" class="closeCreateList">×</button>

            <h2>Create New List</h2>

            <label for="listName">List Name</label>

            <input type="text" id="listName" placeholder="Enter list name...">

            <label for="listSummary">List Summary</label>

            <textarea
                    id="listSummary"
                    placeholder="Enter a summary for your list..."
            ></textarea>

            <button id="saveListButton"> Create List</button>

        </div>

    </div>

    <div id="editListModal" class="createListModal">

        <div class="createListContent">

            <button id="closeEditList" class="closeCreateList">×</button>

            <h2>Edit List</h2>

            <label for="editListName">List Name</label>

            <input
                    type="text"
                    id="editListName"
                    placeholder="Enter list name..."
            >

            <label for="editListSummary">List Summary</label>

            <textarea
                    id="editListSummary"
                    placeholder="Enter a summary for your list..."
            ></textarea>

            <button id="saveEditListButton">Save Changes</button>

        </div>

    </div>

    <div id="movieModal" class="movieModal">

        <div class="movieModalContent">
            <button id="closeMovieModal" class="closeModal">×</button>
            <img id="modalPoster" src="" alt="">

            <div class="modalDetails">
                <h2 id="modalTitle"></h2>

                <p id="modalRating"></p>
                <p id="modalReleaseDate"></p>
                <p id="modalSummary"></p>

                <button id="addToFavoritesButton" class="movieActionButton">Add to Favorites</button>
                <button id="removeFromListButton" class="movieActionButton">Remove from List</button>

            </div>
        </div>
    </div>
</main>

<script src="Lists.js"></script>

</body>
</html>
